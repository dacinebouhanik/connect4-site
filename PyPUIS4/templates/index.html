<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>HichamDacine - Puissance 4</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>


<!-- ================= HEADER ================= -->

<div class="site-header">

<h1 class="title-game">
Puissance <span>4</span>
</h1>

<div class="site-signature">
by HichamDacine
</div>

</div>



<!-- ================= CONTROLES ================= -->

<div class="controls">

<button onclick="nouvellePartie()">Nouvelle partie</button>

<button onclick="annulerCoup()">Annuler coup</button>

<button onclick="ouvrirHistorique()">Historique</button>

<select id="modeSelect" onchange="changerMode()">

<option value="2">2 joueurs humains</option>

<option value="1">1 joueur vs IA</option>

<option value="0">IA vs IA</option>

</select>

</div>



<!-- ================= LAYOUT PRINCIPAL ================= -->

<div class="game-layout">



<!-- ================= PANNEAU IA ================= -->

<div id="zoneIA" class="ia-panel" style="display:none;">

<h3>Réglages IA</h3>


<div class="ia-block">

<strong>Rouge</strong>

<select id="strategieRouge">
<option value="aleatoire">Aléatoire</option>
<option value="minimax" selected>Minimax</option>
</select>

<label>Profondeur</label>

<select id="profRouge">
<option>1</option>
<option selected>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
</select>

</div>



<div class="ia-block">

<strong>Jaune</strong>

<select id="strategieJaune">
<option value="aleatoire">Aléatoire</option>
<option value="minimax" selected>Minimax</option>
</select>

<label>Profondeur</label>

<select id="profJaune">
<option>1</option>
<option selected>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
</select>

</div>



<div class="ia-block">

<strong>Délai IA (ms)</strong>

<input
id="delaiIA"
type="number"
value="600"
min="50"
step="50"
>

<button onclick="appliquerConfigIA()">Valider</button>

</div>

</div>




<!-- ================= CENTRE JEU ================= -->

<div class="game-center">

<!-- MESSAGE JEU / IA -->

<p id="info">Chargement...</p>

<!-- PLATEAU -->

<div id="plateau"></div>

<!-- SCORES MINIMAX -->

<div id="scores" style="margin-top:10px;"></div>


<!-- ================= CONTROLES REPLAY ================= -->

<div id="replayControls" style="display:none; margin-top:20px;">

<button onclick="coupPrecedent()">⬅ Précédent</button>

<button onclick="coupSuivant()">Suivant ➡</button>

</div>


</div>


</div>



<!-- ================= MODAL HISTORIQUE ================= -->

<div id="modalHistorique" class="modal">

<div class="modal-content">

<span class="close" onclick="fermerHistorique()">&times;</span>

<h2>Historique des parties</h2>

<table class="table-historique">

<thead>

<tr>
<th>#</th>
<th>Date</th>
<th>Coups</th>
<th>Résultat</th>
<th>Statut</th>
<th>Action</th>
</tr>

</thead>

<tbody id="listeParties"></tbody>

</table>

</div>

</div>



<!-- ================= FERMETURE MODAL ================= -->

<script>

window.onclick = function(event) {

const modal = document.getElementById("modalHistorique");

if (event.target === modal) {
modal.style.display = "none";
}

}

</script>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
