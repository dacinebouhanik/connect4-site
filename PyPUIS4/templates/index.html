<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Puissance 4</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Puissance 4</h1>

<div class="controls">
    <button onclick="nouvellePartie()">Nouvelle partie</button>
    <button onclick="annulerCoup()">Annuler coup</button>
    <button onclick="ouvrirHistorique()">Historique</button>

    <select id="modeSelect" onchange="changerMode()">
        <option value="2">2 joueurs humains</option>
        <option value="1">1 joueur vs IA</option>
        <option value="0">0 joueur (IA vs IA)</option>
    </select>
</div>


<!-- ================= IMPORT PARTIE BGA ================= -->

<div id="bga_import" style="margin-top:15px;">

<h3>Importer une partie BGA</h3>

<div style="margin-bottom:8px;">

Séquence de coups :

<input id="bga_sequence" type="text" placeholder="ex: 4565553321" style="width:200px">

<button onclick="importerSequence()">Importer</button>

</div>

<p id="import_result"></p>

</div>


<!-- ================= REGLAGES IA ================= -->

<div id="zoneIA" style="display:none; margin-top:10px;">
    <h3>Réglages IA</h3>

    <div style="margin-bottom:8px;">
        <strong>Rouge</strong>
        <select id="strategieRouge">
            <option value="aleatoire">Aléatoire</option>
            <option value="minimax" selected>Minimax</option>
        </select>

        Profondeur :
        <select id="profRouge">
            <option>1</option><option selected>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
        </select>
    </div>

    <div style="margin-bottom:8px;">
        <strong>Jaune</strong>
        <select id="strategieJaune">
            <option value="aleatoire">Aléatoire</option>
            <option value="minimax" selected>Minimax</option>
        </select>

        Profondeur :
        <select id="profJaune">
            <option>1</option><option selected>2</option><option>3</option>
            <option>4</option><option>5</option><option>6</option>
        </select>
    </div>

    <div style="margin-bottom:8px;">
        <strong>Délai IA (ms)</strong>
        <input id="delaiIA" type="number" value="600" min="50" step="50" style="width:90px;">
        <button onclick="appliquerConfigIA()">Valider</button>
    </div>
</div>


<p id="info"></p>

<div id="plateau"></div>

<!-- scores minimax -->
<div id="scores" style="margin-top:10px;"></div>


<!-- ================= HISTORIQUE ================= -->

<div id="historique" style="display:none; margin-top:20px;">

<h3>Historique des parties</h3>

<table class="table-historique">

<thead>
<tr>
<th>#</th>
<th>Date</th>
<th>Coups</th>
<th>Résultat</th>
<th>Statut</th>
<th>Action</th>
</tr>
</thead>

<tbody id="listeParties">
</tbody>

</table>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
